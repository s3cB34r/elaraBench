[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "elarabench"
version = "0.2.1"
description = "Reproducible, provider-neutral benchmarks for local and remote LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "setuptools>=68",
    "types-jsonschema>=4.23",
    "types-PyYAML>=6.0",
    "wheel>=0.42",
]

[project.scripts]
elarabench = "elarabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elarabench = [
    "py.typed",
    "builtin_benchmarks/LICENSE",
    "builtin_benchmarks/*/core-v1/*.yaml",
    "builtin_benchmarks/*/core-v1/*.jsonl",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
